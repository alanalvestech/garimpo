name: radar

on:
  schedule:
    # Not on the hour: the Actions queue peaks at :00 and a scheduled
    # run gets delayed or dropped there.
    - cron: "23 10 * * *" # 07:23 in São Paulo
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the current day even if it is already saved"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml yt-dlp

      - name: Collect and translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/collect.py

      - name: Build the RSS feeds
        run: python scripts/feeds.py

      - name: Commit what changed
        run: |
          # The Actions bot, not "radar": that no-reply address belongs to a
          # real GitHub account and the commits were being credited to them.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ rss.xml
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d)"
            git push
          fi
