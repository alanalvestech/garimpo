name: garimpo

on:
  schedule:
    # Not on the hour: the Actions queue peaks at :00 and a scheduled
    # run gets delayed or dropped there.
    #
    # Three windows because one is not enough: GitHub delivers the schedule
    # event best-effort and silently skips a window under load. A source that
    # already delivered the day is a no-op (done_today in collect.py), so the
    # later runs only retry what the first one missed. All three stay inside
    # the same UTC day, or closed_day() would slide to another date.
    - cron: "23 10 * * *" # 07:23 in São Paulo
    - cron: "37 14 * * *" # 11:37, first backstop
    - cron: "11 19 * * *" # 16:11, last call
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the current day even if it is already saved"
        type: boolean
        default: false

permissions:
  contents: write

# A backstop run must never land on top of the run it is backing up: two of
# them pushing to main at once loses one of the commits.
concurrency:
  group: garimpo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp needs a JavaScript runtime to answer YouTube's player challenge,
      # and only Deno is enabled by default. Without it every video description
      # comes back empty and the channel discovery goes quiet without failing.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install pyyaml yt-dlp

      - name: Collect and translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GARIMPO_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/collect.py

      - name: Build the RSS feeds
        run: python scripts/feeds.py

      - name: Commit what changed
        run: |
          # The Actions bot, not a plain name: a no-reply address like that
          # real GitHub account and the commits were being credited to them.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ rss.xml
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "garimpo: $(date -u +%Y-%m-%d)"
            # Rebase before pushing: main may have moved since checkout, and a
            # rejected push would throw away the day's collection.
            git pull --rebase origin main
            git push
          fi
