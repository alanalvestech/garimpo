# Radar sources.
#
# category: folder under data/, named after the kind of content, not the source.
#           Two sources cannot share a category.
# repo:     owner/name on GitHub
# path:     folder inside the repo holding the daily files
# mode:     "full" keeps title, links and a translated summary (license allows it)
#           "link" keeps title and links only, no summary
# license:  recorded here to justify the chosen mode
# ext:      file extensions considered
# section:  cuts one block out of a file that packs several origins together

sources:
  # ai-research-arm splits by origin under research/, and each of those folders
  # becomes a category. All MIT, so summaries are allowed. The root of research/
  # and digest/ are left out: they are text synthesized from the other folders,
  # not a source.
  # Only the Highlights block: the rest of the file is a flat list, while the
  # highlights carry authors and a TL;DR for each paper.
  - category: Arxiv
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/arxiv
    section: Highlights
    mode: full
    license: MIT
    ext: [.md]

  - category: Twitter
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/twitter
    mode: full
    license: MIT
    ext: [.md]

  - category: Bluesky
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/bluesky
    mode: full
    license: MIT
    ext: [.md]

  - category: Youtube
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/youtube
    mode: full
    license: MIT
    ext: [.md]

  - category: RSS
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/rss
    mode: full
    license: MIT
    ext: [.md]

  - category: Blogs
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/blogs
    mode: full
    license: MIT
    ext: [.md]

  - category: ProductHunt
    name: Product Hunt Daily
    repo: imjszhang/producthunt-daily-hot
    path: data
    mode: full
    license: MIT
    ext: [.md]

  # AI-CG-NEWS-UPDATE packs several blocks into the same daily file, each one a
  # different origin. The section field cuts one out. Product Hunt, Hacker News
  # and arXiv are in there too, but they are left out: each already comes from a
  # licensed source, which allows a translated summary instead of links only.
  - category: GitHubTrending
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: GitHub Trending
    mode: link
    license: no license declared
    ext: [.md]

  - category: HuggingFacePapers
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: Hugging Face Papers
    mode: link
    license: no license declared
    ext: [.md]

  - category: CG
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: CG 图形学
    mode: link
    license: no license declared
    ext: [.md]

  # DailyUpdate is organized by section, one folder per kind of content, and
  # each section becomes a category here. Archive is left out: it holds a single
  # archive_index.json, with no daily file.
  - category: Product
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Product
    mode: link
    license: no license declared
    ext: [.md]

  - category: HackerNews
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: HackerNews
    mode: link
    license: no license declared
    ext: [.md]

  - category: GoogleNews
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: GoogleNews
    mode: link
    license: no license declared
    ext: [.md]

  - category: Papers
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Papers
    mode: link
    license: no license declared
    ext: [.md]

  - category: Reddit
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Reddit
    mode: link
    license: no license declared
    ext: [.md]
