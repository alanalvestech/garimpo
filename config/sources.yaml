# Fontes do radar.
#
# category: pasta dentro de data/, nomeada pelo tipo de conteúdo, não pela fonte.
#           Duas fontes não podem dividir a mesma categoria.
# repo:     owner/nome no GitHub
# path:     pasta dentro do repo onde ficam os arquivos diários
# mode:     "full" republica o conteúdo traduzido (só para fonte com licença que permite)
#           "link" guarda apenas o ponteiro para o arquivo original
# license:  registrado aqui para justificar o mode escolhido
# ext:      extensões consideradas

sources:
  # O ai-research-arm separa por origem dentro de research/, e cada pasta dessas
  # vira uma categoria. Tudo MIT, então entra traduzido. A raiz de research/ e a
  # pasta digest/ ficaram de fora: são texto sintetizado a partir das outras
  # pastas, não fonte.
  - category: Arxiv
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/arxiv
    mode: full
    license: MIT
    ext: [.md]

  - category: Twitter
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/twitter
    mode: full
    license: MIT
    ext: [.md]

  - category: Bluesky
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/bluesky
    mode: full
    license: MIT
    ext: [.md]

  - category: Youtube
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/youtube
    mode: full
    license: MIT
    ext: [.md]

  - category: RSS
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/rss
    mode: full
    license: MIT
    ext: [.md]

  - category: Blogs
    name: AI Research Arm
    repo: guzus/ai-research-arm
    path: research/blogs
    mode: full
    license: MIT
    ext: [.md]

  - category: ProductHunt
    name: Product Hunt Daily
    repo: imjszhang/producthunt-daily-hot
    path: data
    mode: full
    license: MIT
    ext: [.md]

  # O AI-CG-NEWS-UPDATE junta vários blocos no mesmo arquivo diário, e cada
  # bloco é uma origem diferente. O campo section recorta um deles. Product Hunt,
  # Hacker News e arXiv também estão lá, mas ficaram de fora porque já entram por
  # fonte com licença, que permite republicar traduzido em vez de só linkar.
  - category: GitHubTrending
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: GitHub Trending
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: HuggingFacePapers
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: Hugging Face Papers
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: CG
    name: AI CG News Update
    repo: zq52xy/AI-CG-NEWS-UPDATE
    path: daily_news
    section: CG 图形学
    mode: link
    license: sem licença declarada
    ext: [.md]

  # O DailyUpdate organiza por seção, uma pasta por tipo de conteúdo, e cada
  # seção vira uma categoria aqui. Archive ficou de fora porque só tem um
  # archive_index.json, sem arquivo diário.
  - category: Product
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Product
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: HackerNews
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: HackerNews
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: GoogleNews
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: GoogleNews
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: Papers
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Papers
    mode: link
    license: sem licença declarada
    ext: [.md]

  - category: Reddit
    name: Daily Update
    repo: osa-mayor/DailyUpdate
    path: Reddit
    mode: link
    license: sem licença declarada
    ext: [.md]
